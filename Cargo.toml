[package]
name = "trane"
version = "0.34.0"
edition = "2024"
description = "An automated system for learning complex skills"
license = "AGPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/trane-project/trane"

[lib]
name = "trane"

[dependencies]
anyhow = "1.0.104"
postcard = { version = "1.1.3", features = ["use-std"] }
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
derive_builder = "0.20.2"
indoc = "2.0.7"
parking_lot = { version = "0.12.5", features = ["hardware-lock-elision"] }
rand = "0.10.2"
rayon = "1.12.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = "2.6.0"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
strum = { version = "0.28.0", features = ["derive"] }
tempfile = "3.27.0"
thiserror = "2.0.20"
ustr = { version = "1.1.0", features = ["serde"] }
vfs = { version = "0.13.0", features = ["embedded-fs"] }
walkdir = "2.5.0"
noyalib = { version = "0.0.29", features = ["compat-serde-yaml"] }

[dev-dependencies]
pretty_assertions = "1.4"
rust-embed = "8.12.0"

[profile.bench]
debug = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage,coverage_nightly)'] }
